version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentmark-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agentmark
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentmark-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    container_name: agentmark-db-migrate
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/agentmark?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentmark-backend
    environment:
      PORT: 5003
      DATABASE_URL: postgresql://postgres:password@postgres:5432/agentmark?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai-service:5002
      CLAUDE_DESKTOP_DISABLED: "true"
      INTERNAL_SERVICE_SECRET: "dummy_secret_for_docker"
      JWT_SECRET: "dummy_jwt_secret_for_docker"
    ports:
      - "5003:5003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: agentmark-ai-service
    environment:
      PORT: 5002
      REDIS_URL: redis://redis:6379
      INTERNAL_SERVICE_SECRET: "dummy_secret_for_docker"
    ports:
      - "5002:5002"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentmark-frontend
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  redisdata:
