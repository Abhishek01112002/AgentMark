[project]
name = "ai-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.1.14",
    "langgraph>=0.0.17",
    "pydantic>=2.5.0",
    "pytest>=9.0.3",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "openai>=1.40.0",
    "groq>=0.13.0",
    "google-generativeai>=0.8.3",
    "redis>=5.0.1",
    "tavily-python>=0.5.0",
    "json-repair>=0.30.0",
    "langsmith>=0.8.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
markers = [
    "unit: fast offline tests safe for every run",
    "integration: local integration tests that may exercise multiple modules",
    "live: tests that require external API/network access and should not run by default",
]
