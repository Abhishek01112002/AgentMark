[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentmark-mcp-server"
version = "1.3.0"
description = "Model Context Protocol (MCP) server for the AgentMark AI marketing platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "AgentMark", email = "dev@agentmark.ai" },
]
keywords = [
  "mcp",
  "model-context-protocol",
  "agentmark",
  "ai",
  "marketing",
  "campaign",
  "claude",
  "cursor",
  "llm",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "mcp>=1.1.2",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "tenacity>=8.3.0",
]

[project.urls]
Homepage = "https://agentmark.ai"
Documentation = "https://github.com/agentmark/agentmark-mcp-server#readme"
Repository = "https://github.com/agentmark/agentmark-mcp-server"
"Bug Tracker" = "https://github.com/agentmark/agentmark-mcp-server/issues"

[project.scripts]
agentmark-mcp-server = "agentmark_mcp.server:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/agentmark_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

