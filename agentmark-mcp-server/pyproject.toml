[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentmark-mcp-server"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for AgentMark AI marketing platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.1.2",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "tenacity>=8.3.0",
]

[project.scripts]
agentmark-mcp-server = "agentmark_mcp.server:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/agentmark_mcp"]
