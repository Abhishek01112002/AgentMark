version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentmark-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agentmark
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agentmark-redis
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    container_name: agentmark-db-migrate
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/agentmark?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentmark-backend
    init: true
    environment:
      NODE_ENV: production
      PORT: 5003
      DATABASE_URL: postgresql://postgres:password@postgres:5432/agentmark?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai-service:5002
      CLAUDE_DESKTOP_DISABLED: "true"
      INTERNAL_SERVICE_SECRET: "dummy_secret_for_docker"
      JWT_SECRET: "dummy_jwt_secret_for_docker"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Use a tmpfs mount for temporary exports to ensure the container can run read-only root if desired
    tmpfs:
      - /tmp

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: agentmark-ai-service
    init: true
    environment:
      PORT: 5002
      REDIS_URL: redis://redis:6379
      INTERNAL_SERVICE_SECRET: "dummy_secret_for_docker"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentmark-frontend
    ports:
      - "80:80"
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
